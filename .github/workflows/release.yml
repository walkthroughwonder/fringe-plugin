# Tag v* → multi-platform Build workflow (build.yml) produces and attaches zips.
# This file is kept for discoverability; tagging main is enough.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Info
        run: |
          echo "Tag ${{ github.ref_name }} pushed."
          echo "The Build workflow (build.yml) runs on tags and uploads:"
          echo "  - Fringe-*-macOS-universal.zip  (AU + VST3 + Standalone + CLAP)"
          echo "  - Fringe-*-Windows-x64.zip"
          echo "  - Fringe-*-Linux-x86_64.zip"
          echo "Add Apple notarization secrets for signed macOS builds (see docs/SIGNING_AND_NOTARIZATION.md)."
